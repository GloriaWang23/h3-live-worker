name: build h3-vlm image
# h3-vlm：官方 worker-vllm + 预处理 handler（vlm/h3_vlm_handler.py）。先在 runner 上跑单元测试，构建推 GHCR，再在镜像里跑一遍测试和探针（CPU，不加载权重）。
on:
  push:
    branches: [bench-omni-20261020]
    paths: ["vlm/**", ".github/workflows/vlm-image.yml"]
permissions: {contents: read, packages: write}
env:
  TAG: ghcr.io/gloriawang23/h3-vlm:20261021c
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/checkout@v4
      - name: unit tests (runner)
        run: sudo apt-get install -y -qq ffmpeg >/dev/null && cd vlm && python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: vlm
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.TAG }}
            ghcr.io/gloriawang23/h3-vlm:${{ github.sha }}
          provenance: false
      - name: tests + probe inside the image
        run: |
          docker pull "$TAG"
          docker run --rm -v "$PWD/vlm:/w" -w /w --entrypoint python3 "$TAG" -m unittest discover -s tests -v 2>&1 | tee probe.txt
          docker run --rm --entrypoint bash "$TAG" -c '
            python3 -c "import vllm, av; print(\"vllm\", vllm.__version__, \"av\", av.__version__)"
            cd /src && MODEL_NAME=x python3 -c "from args_builder import build_vllm_args as b; a=b(); i=a.index(\"--allowed-local-media-path\") if \"--allowed-local-media-path\" in a else -1; print(\"本地素材目录参数:\", a[i:i+2] if i>=0 else \"缺失\")"
            head -2 /src/handler.py; ls /src' 2>&1 | tee -a probe.txt
      - uses: actions/upload-artifact@v4
        with: {name: vlm-image-probe, path: probe.txt}
