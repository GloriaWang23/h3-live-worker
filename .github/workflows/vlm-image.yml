name: build h3-vlm image
on:
  push:
    branches: [bench-omni-20261020]
    paths: ["vlm/Dockerfile", ".github/workflows/vlm-image.yml"]
permissions: {contents: read, packages: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: vlm
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gloriawang23/h3-vlm:20261021
            ghcr.io/gloriawang23/h3-vlm:${{ github.sha }}
          provenance: false
