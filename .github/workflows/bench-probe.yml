name: probe bench image
# 开机前检查：在 CPU 机器上拉测速镜像、起 ComfyUI，导出 object_info（节点与必填参数）和常用命令是否存在
on:
  push:
    branches: [bench-omni-20261020]
    paths: [".github/workflows/bench-probe.yml"]
  workflow_dispatch:
    inputs:
      image:
        description: image to probe
        required: false
env:
  IMAGE: ${{ inputs.image || 'ghcr.io/gloriawang23/h3-live-worker:bench-comfy-omni-20261020' }}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: probe
        run: |
          docker pull "$IMAGE"
          docker run -d --name p -p 8188:8188 --entrypoint bash "$IMAGE" -c \
            'cd /opt/ComfyUI && /opt/venv-comfy/bin/python main.py --cpu --listen 0.0.0.0 --port 8188 > /tmp/comfy.log 2>&1'
          for i in $(seq 1 120); do curl -fs localhost:8188/object_info > object_info.json && break; sleep 5; done
          docker exec p bash -c 'for c in python3 python /opt/venv-ctl/bin/python /opt/venv-comfy/bin/python ffmpeg ffprobe curl sha256sum timeout seq nvidia-smi git rsync; do printf "%s=%s\n" "$c" "$(command -v $c || echo MISSING)"; done' > tools.txt
          docker exec p tail -60 /tmp/comfy.log > comfy_tail.log || true
          ls -la object_info.json; cat tools.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            object_info.json
            tools.txt
            comfy_tail.log
