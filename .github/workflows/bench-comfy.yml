name: build bench-comfy image

# 精简测速镜像 ghcr.io/gloriawang23/h3-live-worker:bench-comfy（bench 分支改 Dockerfile.comfy 时或手动触发）
on:
  push:
    branches: [bench]
    paths: ["bench/Dockerfile.comfy", "bench/start.sh", "bench/plugins.lock.json", "bench/prepare_plugins.py", ".github/workflows/bench-comfy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bench/Dockerfile.comfy
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gloriawang23/h3-live-worker:bench-comfy-attn-20261020
            ghcr.io/gloriawang23/h3-live-worker:bench-comfy-${{ github.sha }}
          provenance: false
