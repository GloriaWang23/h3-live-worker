name: build bench-sgl image (r20)
# 第二十轮：bench/Dockerfile.sgl（测速镜像 + CUDA 13.0 nvcc + ninja + SGLang 0.5.22 + 剪枝 AdaLN 补丁）→ 推 ghcr，
# 再用新镜像在 CPU 上：① 10Eros 加载对键（check_sgl_adaln.py）② SGLang JIT 内核为 sm_120 编译（check_sgl_jit.py）
on:
  push:
    branches: [bench-r19-probe]
    paths: ["bench/Dockerfile.sgl", "bench/check_sgl_jit.py", ".github/workflows/bench-sgl.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  TAG: ghcr.io/gloriawang23/h3-live-worker:bench-sgl-20261023
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bench/Dockerfile.sgl
          platforms: linux/amd64
          push: true
          tags: ${{ env.TAG }}
          provenance: false
      - name: checks (CPU)
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          docker pull "$TAG"
          docker run --rm -v "$PWD/bench:/bench" --entrypoint bash "$TAG" -c \
            'cd /tmp && /opt/venv-comfy/bin/python /bench/check_sgl_jit.py; /opt/venv-comfy/bin/python /bench/check_sgl_adaln.py /bench/hdr_10eros.json' 2>&1 | tee checks.log | grep -vE "^\s*$" | tail -40
          grep -q "R20_JIT_CHECK ok" checks.log && grep -q "R19_ADALN_CHECK ok" checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-sgl-checks
          path: checks.log
