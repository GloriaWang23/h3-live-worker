name: probe bench image (r19 sglang)
# 第十九轮开机前检查（CPU）：在测速镜像里跑 bench/setup_r19.sh（sglang[diffusion] 0.5.22 + sol-attn，原有包版本不变），
# 起 ComfyUI，确认 SGLD 插件节点与原有节点都能加载，导出 object_info（本地据此校验 r19 的图）
on:
  push:
    branches: [bench-r19-probe]
  workflow_dispatch:
env:
  IMAGE: ghcr.io/gloriawang23/h3-live-worker:bench-comfy-omni-20261020
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: probe
        run: |
          docker pull "$IMAGE"
          docker run -d --name probe -p 8188:8188 -v "$PWD/bench:/bench" --entrypoint bash "$IMAGE" -c \
            'bash /bench/setup_r19.sh > /tmp/setup.log 2>&1; echo "setup rc=$?" >> /tmp/setup.log; cd /opt/ComfyUI && /opt/venv-comfy/bin/python main.py --cpu --disable-dynamic-vram --disable-cuda-malloc --listen 0.0.0.0 --port 8188 > /tmp/comfy.log 2>&1'
          for i in $(seq 1 240); do curl -fs localhost:8188/object_info > object_info.json && break; sleep 5; done
          docker exec probe cat /tmp/setup.log > setup.log || true
          docker exec probe tail -200 /tmp/comfy.log > comfy_tail.log || true
          docker exec probe bash -c 'du -sh /opt/venv-comfy; /opt/venv-comfy/bin/python -m pip freeze' > freeze.txt || true
          cat setup.log | tail -40
          python3 - <<'PY'
          import json
          d = json.load(open("object_info.json"))
          need = ["SGLDOptions", "SGLDUNETLoader", "SGLDLoraLoader", "SelfLiftH3Sampler", "H3MultiStream", "MiniMaxH3SigmaShift"]
          print("MISSING:", [k for k in need if k not in d])
          for k in need[:3]:
              if k in d:
                  print(k, json.dumps(d[k].get("input", {}))[:900])
          PY
          grep -iE "IMPORT FAILED|Traceback|Error" comfy_tail.log | head -20 || true
      - name: check 10Eros pruned AdaLN load (meta device)
        run: |
          sudo sysctl -w vm.overcommit_memory=1   # 稀疏 21 GB 假文件要整段 mmap，CI 只有 16 GB 内存
          docker exec probe bash -c 'cd /tmp && /opt/venv-comfy/bin/python /bench/check_sgl_adaln.py /bench/hdr_10eros.json' 2>&1 | tee adaln_check.log | grep -vE "^\s*$" | tail -40
          grep -q "R19_ADALN_CHECK ok" adaln_check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-r19
          path: |
            object_info.json
            setup.log
            comfy_tail.log
            freeze.txt
            adaln_check.log
