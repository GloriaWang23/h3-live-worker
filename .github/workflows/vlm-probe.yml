name: probe vlm image
# 开机前检查：vLLM 官方镜像能否跑 Qwen3-VL 评委（架构注册、视频依赖、启动参数、入口），不加载权重
on:
  push:
    branches: [bench-omni-20261020]
    paths: [".github/workflows/vlm-probe.yml"]
env:
  IMAGE: vllm/vllm-openai:v0.30.0
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: probe
        run: |
          docker pull "$IMAGE"
          docker inspect "$IMAGE" --format 'ENTRYPOINT={{json .Config.Entrypoint}} CMD={{json .Config.Cmd}}'
          docker run --rm --entrypoint bash "$IMAGE" -c '
            set +e
            python3 -c "import vllm, transformers, torch; print(\"vllm\", vllm.__version__, \"transformers\", transformers.__version__)"
            python3 -c "from vllm.model_executor.models.registry import ModelRegistry as R; a=R.get_supported_archs(); print(\"Qwen3-VL 架构:\", [x for x in a if \"Qwen3VL\" in x])"
            for m in cv2 av decord; do python3 -c "import $m; print(\"$m OK\")" 2>/dev/null || echo "$m 缺"; done
            python3 -c "import hf_transfer; print(\"hf_transfer OK\")" 2>/dev/null || echo "hf_transfer 缺"
            vllm serve --help=all 2>/dev/null | grep -oE "\-\-(limit-mm-per-prompt|media-io-kwargs|mm-processor-kwargs|max-model-len|served-model-name|allowed-local-media-path|revision)" | sort -u
          ' | tee probe.txt
      - uses: actions/upload-artifact@v4
        with: {name: vlm-probe, path: probe.txt}
