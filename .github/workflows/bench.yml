name: build bench image

# 基准测试镜像 ghcr.io/gloriawang23/h3-live-worker:bench（bench 分支 push 或手动触发）。底包约 15 GB，Docker 数据目录挪到 /mnt 防止磁盘不够
on:
  push:
    branches: [bench]
    paths: ["bench/**", ".github/workflows/bench.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /opt/microsoft /opt/google /usr/local/julia* /usr/local/share/powershell
          sudo docker image prune --all --force
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker && echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bench/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gloriawang23/h3-live-worker:bench
            ghcr.io/gloriawang23/h3-live-worker:bench-${{ github.sha }}
          provenance: false
      - name: Disk after build
        if: always()
        run: df -h / /mnt
